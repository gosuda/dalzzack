[package]
name = "dalzzack"
version = "1.2.0"
description = "Browser automation CLI for AI agents — screenshot-first, token-efficient."
authors = ["dalzzack contributors"]
edition = "2021"
license = "MIT"
# Where `dalzzack upgrade` finds releases (compiled in via env!("CARGO_PKG_REPOSITORY")).
repository = "https://github.com/gosuda/dalzzack"
readme = "../README.md"
keywords = ["browser", "automation", "ai", "agent", "cli"]
categories = ["command-line-utilities", "web-programming"]
exclude = ["target/*", "gen/*", "icons/android/*", "icons/ios/*"]

[lib]
name = "dalzzack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CLI binary entry point. Without this section, cargo only builds the lib,
# and src/main.rs is silently ignored — leaving a stale dalzzack.exe in target/release/.
[[bin]]
name = "dalzzack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["webview-data-url"] }
tauri-plugin-opener = "2.7.2"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full", "io-std", "net"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
chrono = "0.4.45"
base64 = "0.23.1"
lazy_static = "1.5.1"
reqwest = { version = "0.13.5", features = ["cookies", "json"] }
semver = "1.0.28"
sha2 = "0.10.9"
url = "2.5.8"
xcap = "0.9.8"
image = "0.25.10"
imageproc = "0.27.0"
jaq-core = "3.1.2"
jaq-std = "3.0.4"
jaq-json = "2.0.3"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
dirs = "5.0"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux dependencies
webkit2gtk = "2.0"
gio = "0.18"
javascriptcore-rs = "1.1"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "consoleapi"] }
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Wdk_System_Threading",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
core-graphics = "0.24"
# `start --trust-cert` and the certificate reason of a failed load. Both are
# already in Cargo.lock through rustls-platform-verifier.
security-framework = "3"
core-foundation = "0.10"

[features]
# DevTools on by default: this is a debugging/automation tool, so F12 and
# `attach-devtools` must work in release builds too. Without tauri/devtools,
# WebView2 is created with AreDevToolsEnabled=false and F12/OpenDevToolsWindow
# are no-ops. Build with `--no-default-features` to ship a locked-down binary.
default = ["webview-devtools"]
webview-devtools = ["tauri/devtools"]
