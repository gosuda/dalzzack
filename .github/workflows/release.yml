name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # One job creates the release, so the build jobs only upload to it and never
  # race each other to create it.
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: |
            Install: https://github.com/${{ github.repository }}#install
            Changes: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md

            Download `dalzzack-macos-universal.tar.gz` (Apple silicon and Intel) or `dalzzack-windows-x64.zip`, each with a `.sha256` file. The macOS binary is not notarized: if you download it in a browser, run `xattr -d com.apple.quarantine <path to dalzzack>` once. A download with `curl` does not need this.
        run: |
          # A tag with a hyphen (v1.0.0-rc.1) becomes a pre-release, which
          # `releases/latest/download/...` skips, so the README links never point at it.
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "dalzzack $TAG" --notes "$NOTES" "${flags[@]}"

  build:
    name: Build (${{ matrix.os }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset: dalzzack-macos-universal.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            asset: dalzzack-windows-x64.zip
          # Linux is not a supported target: the Linux platform backend
          # (src/platform/js_exec.rs, mouse.rs) is an unbuilt stub.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The binary only. The Tauri installers did not put `dalzzack` on PATH,
      # and their shortcut ran it with no arguments, which only prints the help.
      - run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle

      # A fixed name: the README links to `releases/latest/download/<asset>`,
      # which stays valid for every version.
      - name: Package the binary (macOS)
        if: runner.os == 'macOS'
        run: |
          bin=src-tauri/target/${{ matrix.target }}/release/dalzzack
          test -x "$bin"
          lipo -info "$bin"
          codesign --force --sign - "$bin"
          tar -czf "${{ matrix.asset }}" -C "$(dirname "$bin")" dalzzack
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Package the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "src-tauri/target/${{ matrix.target }}/release/dalzzack.exe"
          if (-not (Test-Path $bin)) { throw "missing $bin" }
          Compress-Archive -Path $bin -DestinationPath "${{ matrix.asset }}"
          $hash = (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          # LF, not Set-Content's CRLF: `sha256sum -c` reads the CR as part of the file name.
          $sha = Join-Path $PWD "${{ matrix.asset }}.sha256"
          [IO.File]::WriteAllText($sha, "$hash  ${{ matrix.asset }}`n")
      - name: Attach the binary to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
