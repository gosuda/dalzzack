name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  clippy:
    name: Clippy
    # Runs on macOS: the project targets macOS + Windows. The Linux platform
    # backend (src/platform/js_exec.rs, mouse.rs) is an unbuilt stub, so linting
    # the Linux cfg path would fail on code we don't ship.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --bins

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-
      - run: npm ci
      - run: npm run build
      - run: cargo build --manifest-path src-tauri/Cargo.toml
      # A throw-away runner is the only safe place for --purge on Windows:
      # dalzzack finds these folders through the Known Folder API, so a test
      # cannot redirect them.
      - name: Check that uninstall leaves nothing (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dalzzack'
          $exe = Join-Path $dir 'dalzzack.exe'
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item src-tauri\target\debug\dalzzack.exe $exe
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $before = $key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.SetValue('Path', "$($before.TrimEnd(';'));$dir", [Microsoft.Win32.RegistryValueKind]::ExpandString)
          & $exe install all
          if ($LASTEXITCODE -ne 0) { throw 'install all failed' }
          $profile_dir = Join-Path $env:LOCALAPPDATA 'org.gosuda.dalzzack\EBWebView'
          $logs = Join-Path $env:LOCALAPPDATA 'dalzzack\logs'
          New-Item -ItemType Directory -Force -Path $profile_dir, $logs | Out-Null
          & $exe uninstall --yes --purge
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          for ($i = 0; $i -lt 40 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $dir) { throw "$dir is still there" }
          foreach ($path in "$env:LOCALAPPDATA\dalzzack", "$env:LOCALAPPDATA\org.gosuda.dalzzack", "$env:USERPROFILE\.claude\CLAUDE.md", "$env:USERPROFILE\.codex\AGENTS.md") {
            if (Test-Path $path) { throw "$path is still there" }
          }
          $after = $key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if ($after -cne $before.TrimEnd(';')) { throw "The user Path changed: $after" }

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-
      - run: npm ci
      - run: npm run deploy
      - name: Run smoke script (macOS)
        if: runner.os == 'macOS'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/smoke.sh
      # On a throw-away runner this measures the real folders under ~/Library.
      - name: Check that uninstall leaves nothing (macOS)
        if: runner.os == 'macOS'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          dalzzack install all
          dalzzack start --id uninstall-check --ttl 2m
          dalzzack navigate -i uninstall-check --url "https://example.com" --timeout-ms 5000
          dalzzack uninstall --yes --purge
          # bash remembers the path of a command it ran, and command -v repeats it.
          hash -r
          if command -v dalzzack >/dev/null; then
            echo "The binary is still there" >&2
            exit 1
          fi
          left=$(find "$HOME/Library" -maxdepth 4 -iname '*dalzzack*' 2>/dev/null || true)
          if [ -n "$left" ]; then
            printf 'Still there:\n%s\n' "$left" >&2
            exit 1
          fi
          if grep -rqs 'dalzzack-begin' "$HOME/.claude" "$HOME/.codex"; then
            echo "A guide is still there" >&2
            exit 1
          fi
